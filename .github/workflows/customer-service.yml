name: Customer Service CI

on:
  push:
    branches:
      - master

  pull_request:
    paths:
      - 'customer-service/**'

jobs:
  customer-service-ci:
    uses: ./.github/workflows/reusable-java-ci.yml

    with:
      service-name: "Customer Service"
      working-directory: "customer-service"
      java-version: "17"
