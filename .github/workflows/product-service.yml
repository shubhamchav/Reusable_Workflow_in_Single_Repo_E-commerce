name: Product Service CI

on:
  push:
    branches:
      - main

  pull_request:
    paths:
      - 'product-service/**'

jobs:
  product-service-ci:
    uses: ./.github/workflows/reusable-java-ci.yml

    with:
      service-name: "Product Service"
      working-directory: "product-service"
      java-version: "17"
